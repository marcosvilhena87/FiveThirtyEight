name: Brasileirão — atualização automática
on:
  schedule:
    - cron: '20 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: brasileirao-2026-update
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3'
      - name: Testes
        run: python -m unittest discover -s tests -v
      - name: Consultar placares e simular
        env:
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: python -m src.auto_update --runs 200000 --seed 42
      - name: Publicar apenas se houver nova data-base
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/brasileirao_2026 results/brasileirao_2026
          if git diff --cached --quiet; then
            echo "Sem alterações"
          else
            git commit -m "data: atualiza probabilidades do Brasileirao 2026"
            git push
          fi
