name: Testes do simulador
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Testes e validacao sintatica
        run: |
          python -m compileall -q src tests
          python -m unittest discover -s tests -v
